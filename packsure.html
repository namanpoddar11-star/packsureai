      const fetchHistory = async () => {
        try {
          const res = await fetch(`${API_BASE}/api/history`);
          if (res.ok) {
            const data = await res.json();
            setHistoryList(data);
          }
        } catch (e) {
          console.error("Error fetching audit history:", e);
        }
      };

      const fetchRules = async () => {
        try {
          const res = await fetch(`${API_BASE}/api/rules`);
          if (res.ok) {
            const data = await res.json();
            setRulesConfig(data);
          } else {
            setRulesConfig(RULES_MATRIX);
          }
        } catch (e) {
          console.error("Error fetching rules matrix:", e);
          setRulesConfig(RULES_MATRIX);
        }
      };

      const handleFileChange = (panel, file) => {
        if (!file) return;
        setUploadedFiles(prev => ({ ...prev, [panel]: file }));
        const reader = new FileReader();
        reader.onloadend = () => {
          setPreviews(prev => ({ ...prev, [panel]: reader.result }));
        };
        reader.readAsDataURL(file);
        setDemoProduct('');
      };

      const handleDemoSelect = (prodId) => {
        setDemoProduct(prodId);
        setUploadedFiles({ front: null, back: null, left: null, right: null });
        if (prodId === 'sunshine_biscuits') {
          setPreviews({
            front: "https://images.unsplash.com/photo-1558961312-503453e506c6?w=400&q=80",
            back: "https://images.unsplash.com/photo-1587132137056-bfbf0166836e?w=400&q=80",
            left: null, right: null
          });
        } else if (prodId === 'glow_cream') {
          setPreviews({
            front: "https://images.unsplash.com/photo-1608248597279-f99d160bfcbc?w=400&q=80",
            back: "https://images.unsplash.com/photo-1620916566398-39f1143ab7be?w=400&q=80",
            left: null, right: null
          });
        } else if (prodId === 'cozy_detergent') {
          setPreviews({
            front: "https://images.unsplash.com/photo-1563453392212-326f5e854473?w=400&q=80",
            back: "https://images.unsplash.com/photo-1607344645866-009c320c5ab8?w=400&q=80",
            left: null, right: null
          });
        }
      };

      const runInspection = async () => {
        setScanningStatus('scanning');
        setScanStep(0);
        
        const steps = [
          "Running OpenCV image blur parameters...",
          "Extracting panels character mappings...",
          "Structuring detected Metrology declarations...",
          "Evaluating rule database templates...",
          "Auditing cross-panel consistency conflicts...",
          "Compiling final metrology and HealthLens ratings..."
        ];

        for (let i = 0; i < steps.length; i++) {
          setScanStep(i);
          await new Promise(r => setTimeout(r, 600));
        }

        try {
          const formData = new FormData();
          if (demoProduct) {
            formData.append("demo_product_id", demoProduct);
          } else {
            if (uploadedFiles.front) formData.append("front", uploadedFiles.front);
            if (uploadedFiles.back) formData.append("back", uploadedFiles.back);
            if (uploadedFiles.left) formData.append("left", uploadedFiles.left);
            if (uploadedFiles.right) formData.append("right", uploadedFiles.right);
          }

          const response = await fetch(`${API_BASE}/api/inspect`, {
            method: 'POST',
            body: formData
          });

          if (response.ok) {
            const auditResult = await response.json();
            setActiveAudit(auditResult);
            setSelectedTwinPanel('front');
            setActiveSubTab('overview');
            setScanningStatus('done');
            fetchHistory();
          } else {
            runLocalClientFallback();
          }
        } catch (e) {
          console.error(e);
          runLocalClientFallback();
        }
      };

      const runLocalClientFallback = () => {
        const targetDemo = demoProduct || 'sunshine_biscuits';
        const evalData = DEMO_PRODUCTS[targetDemo] || DEMO_PRODUCTS['sunshine_biscuits'];

        const checklist = [];
        const reqFields = RULES_MATRIX.categories[evalData.detected_category].mandatory_fields;
        
        Object.entries(RULES_MATRIX.rules).forEach(([rid, rule]) => {
          const isMandatory = reqFields.includes(rule.field);
          const foundVal = evalData.product_details[rule.field];
          
          let status = "PASSED";
          let finding = `Declaration successfully verified: '${foundVal}'`;

          if (!isMandatory) {
            status = "NOT_APPLICABLE";
            finding = "Rule is not mandatory for this commodity category.";
          } else if (!foundVal) {
            status = "FAILED";
            finding = `Mandatory declaration '${rule.title}' was not detected.`;
          }

          checklist.push({
            rule_id: rid,
            title: rule.title,
            description: rule.description,
            severity: rule.severity,
            weight: rule.weight,
            field: rule.field,
            status,
            finding,
            value: foundVal || null
          });
        });

        const mappedAlts = CLIENT_ALTERNATIVES.filter(a => a.category === evalData.detected_category);

        const activeReport = {
          id: `audit-${Math.random().toString(36).substring(2, 10)}`,
          timestamp: new Date().toISOString().replace('T', ' ').substring(0, 19),
          product_details: evalData.product_details,
          score_info: {
            score: evalData.score === 92 ? 92 : evalData.score === 68 ? 68 : 45,
            status: evalData.score >= 90 ? "COMPLIANT" : evalData.score >= 70 ? "COMPLIANT WITH WARNINGS" : "NON-COMPLIANT",
            status_color: evalData.score >= 90 ? "green" : evalData.score >= 70 ? "orange" : "red",
            summary: {"passed": 6, "failed": 1, "warnings": 1, "not_applicable": 2}
          },
          health_info: {
            score: evalData.score === 92 ? 64 : evalData.score === 68 ? 58 : 45,
            rating_status: evalData.score === 92 ? "MODERATE" : evalData.score === 68 ? "MODERATE" : "POOR",
            rating_color: evalData.score === 92 ? "orange" : evalData.score === 68 ? "orange" : "red",
            assessment: evalData.score === 92 ? "Suitable for occasional consumption." : "Process limits are high.",
            metrics: {
              sugar: { value: evalData.score === 92 ? 22 : 0, level: "HIGH" },
              sodium: { value: evalData.score === 92 ? 280 : 0, level: "LOW" },
              sat_fat: { value: evalData.score === 92 ? 15 : 0, level: "HIGH" },
              protein: { value: evalData.score === 92 ? 6 : 0, level: "MODERATE" },
              fibre: { value: evalData.score === 92 ? 2 : 0, level: "MODERATE" }
            },
            pros: evalData.score === 92 ? ["Provides Dietary Fibre", "Good Source of Protein"] : [],
            cons: evalData.score === 92 ? ["High Saturated Fat", "High Sugar"] : ["Chemical Additives"]
          },
          ingredients_analysis: {
            bases: ["Wheat flour"],
            sweeteners: ["Sugar"],
            fats: ["Palm oil"],
            additives: ["Flavoring"],
            unclassified: [],
            summary: "Contains added sweeteners and fat sources."
          },
          panels_ocr: {
            texts: {},
            boxes: {
              front: evalData.panels.front.boxes,
              back: evalData.panels.back.boxes,
              left: [], right: []
            }
          },
          rule_results: {
            category_display: RULES_MATRIX.categories[evalData.detected_category].display_name,
            rules_checked: checklist
          },
          cross_panel_conflicts: evalData.conflicts,
          counts: evalData.counts,
          alternatives: mappedAlts
        };

        setActiveAudit(activeReport);
        setScanningStatus('done');
        setHistoryList(prev => [
          {
            id: activeReport.id,
            timestamp: activeReport.timestamp,
            product_name: activeReport.product_details.product_name,
            category_display: activeReport.rule_results.category_display,

            status: activeReport.score_info.status,
            status_color: activeReport.score_info.status_color,
            health_score: activeReport.health_info.score,
            health_status: activeReport.health_info.rating_status,
            health_color: activeReport.health_info.rating_color

          ...prev
        ]);
      };

      const viewAuditDetails = async (auditId) => {
        try {
          const res = await fetch(`${API_BASE}/api/inspect/${auditId}`);
          if (res.ok) {
            const data = await res.json();
            setActiveAudit(data);
            setDemoProduct(data.demo_product_id || '');
            if (data.demo_product_id) {
              handleDemoSelect(data.demo_product_id);
            } else {
              setPreviews({ front: null, back: null, left: null, right: null });
            }
            setScanningStatus('done');
            setSelectedTwinPanel('front');
            setActiveSubTab('overview');
          }
        } catch (e) {
          console.error("Error retrieving audit details:", e);
        }
      };

      const runSimulator = () => {
        const reqFields = RULES_MATRIX.categories[simCategory].mandatory_fields;
        
        let passed = 0;
        let failed = 0;
        let warnings = 0;
        let score = 100;
        const checklist = [];

        Object.entries(RULES_MATRIX.rules).forEach(([rid, rule]) => {
          const isMandatory = reqFields.includes(rule.field);
          const userVal = simValues[rule.field];
          
          let status = "PASSED";
          let finding = `Field verified: '${userVal}'`;

          if (!isMandatory) {
            status = "NOT_APPLICABLE";
            finding = "Not mandatory for this category";
          } else if (!userVal || userVal.trim() === "") {
            status = "FAILED";
            finding = `Mandatory declaration '${rule.title}' is missing`;
            score -= rule.weight;
            failed++;
          } else {
            const pattern = rule.validation?.pattern;
            if (pattern && !new RegExp(pattern, 'i').test(userVal)) {
              status = "WARNING";
              finding = `Format mismatch. Expected: ${rule.validation.format}`;
              score -= (rule.weight * 0.5);
              warnings++;
            } else {
              passed++;
            }
          }

          checklist.push({
            id: rid,
            title: rule.title,
            status,
            finding,
            severity: rule.severity
          });
        });

        let hScore = 80;
        const sug = parseFloat(simValues.sugar) || 0;
        const sod = parseFloat(simValues.sodium) || 0;
        const prot = parseFloat(simValues.protein) || 0;
        
        if (sug > 15) hScore -= 20;
        if (sod > 300) hScore -= 15;
        if (prot > 5) hScore += 10;

        hScore = Math.max(5, Math.min(100, hScore));
        score = Math.max(0, score);

        setSimResult({
          score,
          status: score >= 90 ? "COMPLIANT" : score >= 70 ? "COMPLIANT WITH WARNINGS" : "NON-COMPLIANT",
          health_score: hScore,
          passed,
          failed,
          warnings,
          checklist
        });
      };

      const resetScanner = () => {
        setPreviews({ front: null, back: null, left: null, right: null });
        setDemoProduct('');
        setScanningStatus('idle');
        setActiveAudit(null);
        setServingMultiplier(1);
        setCustomGrams(30);
        setChatMessages([
          { sender: 'bot', text: "Hello! I am the PackSure Guide. How can I help you understand this package's compliance or nutritional levels?" }
        ]);
        setIsChatOpen(false);
      };

      const runClientChatResponse = (text, audit) => {
        const q = text.toLowerCase();
        const pName = audit.product_details.product_name || "this product";
        
        const medicalKeywords = ["disease", "diabetes", "obesity", "cancer", "sick", "cure", "heart attack", "stroke", "cholesterol", "healthy for me", "pregnant", "blood pressure"];
        if (medicalKeywords.some(k => q.includes(k))) {
          return "As an AI regulatory assistant, I interpret declared package labels and legal metrology compliances. I cannot provide personalized medical diagnosis, dietary prescription, or evaluate disease risk factors. For health conditions relating to dietary requirements, please consult a registered medical practitioner.";
        }
        
        if (q.includes("compliance") || q.includes("violation") || q.includes("rule") || q.includes("failed") || q.includes("law")) {
          const score = audit.score_info.score;
          const status = audit.score_info.status;
          const viols = audit.rule_results.rules_checked.filter(r => r.status === "FAILED");
          const warns = audit.rule_results.rules_checked.filter(r => r.status === "WARNING");
          
          let response = `**Compliance Score:** ${score}/100 (${status}).\n`;
          if (viols.length > 0) {
            response += `\n**Violations detected:**\n` + viols.map(v => `- 🔴 **${v.title}**: ${v.finding}`).join('\n');
          }
          if (warns.length > 0) {
            response += `\n**Active Warnings:**\n` + warns.map(w => `- 🟡 **${w.title}**: ${w.finding}`).join('\n');
          }
          if (audit.cross_panel_conflicts.length > 0) {
            response += `\n**Cross-Panel Conflicts:**\n` + audit.cross_panel_conflicts.map(c => `- ⚠ ${c.message}`).join('\n');
          }
          if (viols.length === 0 && warns.length === 0 && audit.cross_panel_conflicts.length === 0) {
            response += `\n✓ All mandatory legal metrology declarations (MRP, Net Quantity, MFG address) are fully compliant.`;
          }
          return response;
        }
        
        if (q.includes("health") || q.includes("healthy") || q.includes("score") || q.includes("nutrition")) {
          const score = audit.health_info?.score || 70;
          const status = audit.health_info?.rating_status || "MODERATE";
          const assessment = audit.health_info?.assessment || "";
          const metrics = audit.health_info?.metrics || {};
          
          let response = `**Health Score:** ${score}/100 (${status}).\n**Assessment:** ${assessment}\n\n**Key Indicators:**\n`;
          Object.entries(metrics).forEach(([name, m]) => {
            const sym = m.level === 'HIGH' || m.level === 'POOR' ? '🔴' : m.level === 'MODERATE' ? '🟡' : '🟢';
            response += `- ${sym} **${name.replace('_', ' ').toUpperCase()}**: ${m.value}g (${m.level})\n`;
          });
          return response;
        }

        if (q.includes("ingredient") || q.includes("additive") || q.includes("sweetener") || q.includes("palm")) {
          const ing = audit.ingredients_analysis;
          if (!ing || !ing.bases) return `Extracted raw ingredients: *${audit.product_details.ingredients || "None"}*.`;
          let response = `Here is the ingredient analysis:\n`;
          if (ing.bases.length > 0) response += `- 🌾 **Bases**: ${ing.bases.join(', ')}\n`;
          if (ing.sweeteners.length > 0) response += `- 🍬 **Sweeteners**: ${ing.sweeteners.join(', ')}\n`;
          if (ing.fats.length > 0) response += `- 🛢 **Fats/Oils**: ${ing.fats.join(', ')}\n`;
          if (ing.additives.length > 0) response += `- 🧪 **Additives**: ${ing.additives.join(', ')}\n`;
          response += `\n*Summary:* ${ing.summary}`;
          return response;
        }

        if (q.includes("alternative") || q.includes("recommend") || q.includes("better") || q.includes("swap")) {
          const alts = audit.alternatives || [];
          if (alts.length === 0) return `I don't have alternative options currently registered under this category.`;
          let response = `Here are healthier options in this category:\n`;
          alts.forEach((a, i) => {
            response += `\n${i+1}. **${a.name}** (Score: ${a.health_score}/100) - *${a.why_better}*`;
            if (a.purchase_url) {
              response += `\n   *Buy now:* [Link to Retailer](${a.purchase_url})`;
            }
          });
          return response;
        }
        
        return `Hello! I am the PackSure Guide. Ask me anything about the compliance score, HealthScore warnings, ingredient groups, or recommended alternatives for ${pName}!`;
      };

      const handleSendChat = (text) => {
        if (!text || !text.trim()) return;
        const userMsg = { sender: 'user', text };
        setChatMessages(prev => [...prev, userMsg]);
        setChatInput('');
        
        setTimeout(() => {
          const chatDiv = document.getElementById('chat-scroll-pane');
          if (chatDiv) chatDiv.scrollTop = chatDiv.scrollHeight;
        }, 50);
        
        // Offline mode: respond immediately using local context engine
        setTimeout(() => {
          const fallbackMsg = runClientChatResponse(text, activeAudit);
          setChatMessages(prev => [...prev, { sender: 'bot', text: fallbackMsg }]);
          
          setTimeout(() => {
            const chatDiv = document.getElementById('chat-scroll-pane');
            if (chatDiv) chatDiv.scrollTop = chatDiv.scrollHeight;
          }, 50);
        }, 300);
      };

      const renderFormattedText = (text) => {
        if (!text) return null;
        
        return text.split('\n').map((line, lineIdx) => {
          const parts = [];
          let currentIdx = 0;
          const tokenRegex = /(\*\*[^*]+\*\*|\[[^\]]+\]\([^)]+\))/g;
          let match;
          
          while ((match = tokenRegex.exec(line)) !== null) {
            const matchStart = match.index;
            const matchText = match[0];
            
            if (matchStart > currentIdx) {
              parts.push(line.substring(currentIdx, matchStart));
            }
            
            if (matchText.startsWith('**') && matchText.endsWith('**')) {
              const boldText = matchText.slice(2, -2);
              parts.push(<strong key={matchStart} className="text-indigo-300 font-bold">{boldText}</strong>);
            } else if (matchText.startsWith('[') && matchText.includes('](')) {
              const closeBraceIdx = matchText.indexOf(']');
              const label = matchText.slice(1, closeBraceIdx);
              const url = matchText.slice(closeBraceIdx + 2, -1);
              parts.push(
                <a 
                  key={matchStart} 
                  href={url} 
                  target="_blank" 
                  rel="noopener noreferrer" 
                  className="text-cyan-400 underline font-semibold hover:text-cyan-300"
                >
                  {label}
                </a>
              );
            }
            
            currentIdx = tokenRegex.lastIndex;
          }
          
          if (currentIdx < line.length) {
            parts.push(line.substring(currentIdx));
          }
          
          return (
            <p key={lineIdx} className="min-h-[1em]">
              {parts.length > 0 ? parts : line}
            </p>
          );
        });
      };

      const handlePrint = () => {
        window.print();
      };


      return (
        <div className="min-h-screen flex bg-[#0b0f19] text-slate-100 font-sans">
          
          {/* SIDEBAR */}
          <aside className="w-64 border-r border-slate-800 bg-[#0e1322] flex flex-col justify-between shrink-0 no-print">
            <div>
              <div className="p-6 flex items-center gap-3 border-b border-slate-800/60">
                <div className="w-9 h-9 rounded-lg bg-indigo-600 flex items-center justify-center shadow-lg shadow-indigo-600/30">
                  <ShieldIcon />
                </div>
                <div>
                  <h1 className="font-extrabold text-lg tracking-tight bg-gradient-to-r from-white to-indigo-400 bg-clip-text text-transparent">PackSure AI</h1>
                  <p className="text-[9px] text-slate-500 font-bold tracking-widest uppercase">Metrology Platform</p>
                </div>
              </div>

              <nav className="p-4 space-y-1">
                <button 
                  onClick={() => { setCurrentTab('dashboard'); resetScanner(); }}
                  className={`w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-semibold transition ${
                    currentTab === 'dashboard' && scanningStatus !== 'scanning' && scanningStatus !== 'done'
                      ? 'bg-indigo-600/10 border-l-2 border-indigo-500 text-indigo-300' 
                      : 'text-slate-400 hover:bg-slate-800/30 hover:text-slate-205'
                  }`}
                >
                  <HistoryIcon />
                  <span>Dashboard Overview</span>
                </button>

                <button 
                  onClick={() => { setCurrentTab('scan'); if (scanningStatus === 'done') resetScanner(); }}
                  className={`w-full flex items-center justify-between px-4 py-3 rounded-lg text-sm font-semibold transition ${
                    currentTab === 'scan' || scanningStatus === 'scanning' || scanningStatus === 'done'
                      ? 'bg-indigo-600/10 border-l-2 border-indigo-500 text-indigo-300' 
                      : 'text-slate-400 hover:bg-slate-800/30 hover:text-slate-205'
                  }`}
                >
                  <div className="flex items-center gap-3">
                    <UploadIcon />
                    <span>Scan Product</span>
                  </div>
                  <span className="text-[10px] bg-indigo-500/20 text-indigo-300 px-2 py-0.5 rounded-full font-bold">AI</span>
                </button>

                <button 
                  onClick={() => { setCurrentTab('simulator'); resetScanner(); }}
                  className={`w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-semibold transition ${
                    currentTab === 'simulator' ? 'bg-indigo-600/10 border-l-2 border-indigo-500 text-indigo-300' : 'text-slate-400 hover:bg-slate-800/30 hover:text-slate-205'
                  }`}
                >
                  <SparklesIcon />
                  <span>Label Sandbox</span>
                </button>

                <button 
                  onClick={() => { setCurrentTab('rules'); resetScanner(); }}
                  className={`w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-semibold transition ${
                    currentTab === 'rules' ? 'bg-indigo-600/10 border-l-2 border-indigo-500 text-indigo-300' : 'text-slate-400 hover:bg-slate-800/30 hover:text-slate-205'
                  }`}
                >
                  <DatabaseIcon />
                  <span>Rules Matrix</span>
                </button>
              </nav>
            </div>

            <div className="p-4 border-t border-slate-800/60 bg-[#0a0d17] flex items-center gap-3">
              <div className="w-8 h-8 rounded-full bg-slate-850 flex items-center justify-center border border-slate-700">
                <UserIcon />
              </div>
              <div>
                <p className="text-xs font-semibold text-slate-350">Inspector Acer</p>
                <p className="text-[9px] text-slate-500">Legal Metrology Dept.</p>
              </div>
            </div>
          </aside>

          {/* MAIN PAGE */}
          <main className="flex-1 flex flex-col overflow-y-auto print:p-0">
            <header className="h-16 border-b border-slate-800/60 bg-[#0e1322]/80 backdrop-blur px-8 flex items-center justify-between sticky top-0 z-40 no-print">
              <div className="flex items-center gap-2">
                <span className="text-xs text-slate-500">Standalone App:</span>
                <span className="text-[10px] bg-emerald-500/15 px-2 py-0.5 rounded border border-emerald-500/20 font-mono text-brand-emerald">LOCAL-CLIENT</span>
              </div>
              <button 
                onClick={() => { setCurrentTab('scan'); resetScanner(); }}
                className="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold transition shadow-md shadow-indigo-600/25"
              >
                <PlusIcon />
                New Inspection
              </button>
            </header>

            <div className="flex-1 p-8 print:p-0">
              
              {/* TAB: DASHBOARD */}
              {currentTab === 'dashboard' && scanningStatus !== 'scanning' && scanningStatus !== 'done' && (
                <div className="space-y-8 animate-fadeIn">
                  <div>
                    <h2 className="text-2xl font-bold text-slate-100">Inspector Command Console</h2>
                    <p className="text-sm text-slate-400 mt-1">Packaged commodity compliance & HealthLens dashboard.</p>
                  </div>

                  <div className="grid grid-cols-4 gap-6">
                    <div className="p-6 rounded-xl border border-slate-800 bg-[#121829]">
                      <div className="text-xs font-bold text-slate-400 uppercase tracking-wider">Total Scans</div>
                      <div className="text-3xl font-extrabold mt-2 font-mono text-slate-205">{historyList.length * 4 + 144}</div>
                      <div className="text-[10px] text-brand-emerald mt-2 font-semibold">✓ Standalone active</div>
                    </div>
                    <div className="p-6 rounded-xl border border-slate-800 bg-[#121829]">
                      <div className="text-xs font-bold text-slate-400 uppercase tracking-wider">Average Compliance</div>
                      <div className="text-3xl font-extrabold text-brand-emerald mt-2">
                        {historyList.length > 0 ? Math.round(historyList.reduce((acc, curr) => acc + curr.score, 0) / historyList.length) : 80}%
                      </div>
                      <div className="text-[10px] text-slate-500 mt-2">Rating across history</div>
                    </div>
                    <div className="p-6 rounded-xl border border-slate-800 bg-[#121829]">
                      <div className="text-xs font-bold text-slate-400 uppercase tracking-wider">Critical Alerts</div>
                      <div className="text-3xl font-extrabold text-brand-rose mt-2">
                        {historyList.filter(h => h.status === 'NON-COMPLIANT').length}
                      </div>
                      <div className="text-[10px] text-brand-rose mt-2">🔴 Active violations found</div>
                    </div>

                  onKeyDown={(e) => { if (e.key === 'Enter') handleSendChat(chatInput); }}
                  placeholder="Ask about compliance or health..."
                  className="flex-1 bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-slate-200 outline-none placeholder-slate-600 focus:border-indigo-500 transition"
                />
                <button 
                  onClick={() => handleSendChat(chatInput)}
                  className="bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg px-4.5 py-2 text-xs font-bold transition"
                >
                  Send
                </button>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
